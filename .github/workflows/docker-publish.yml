name: Build and Publish Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Registries and Credentials
        id: registries
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGES="${{ env.REGISTRY }}/${IMAGE_LOWER}"
          
          DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          DH_PASS="${{ secrets.DOCKERHUB_TOKEN }}"
          if [ -z "$DH_PASS" ]; then
            DH_PASS="${{ secrets.CARLORIGONI }}"
          fi
          if [ -z "$DH_USER" ] && [ -n "$DH_PASS" ]; then
            DH_USER="carlorigoni"
          fi

          if [ -n "$DH_USER" ] && [ -n "$DH_PASS" ]; then
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "dh_user=$DH_USER" >> "$GITHUB_OUTPUT"
            IMAGES="${IMAGES}"$'\n'"carlorigoni/smarttimetablefet"
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "images<<EOF"
            echo "$IMAGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub (if secrets provided)
        if: steps.registries.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.registries.outputs.dh_user }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.CARLORIGONI }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
