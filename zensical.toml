[project]
site_url = "https://docs.eurario.it/"
site_name = "Eurario — Documentazione"
site_description = "Guida ufficiale e documentazione tecnica di Eurario: gestione orario scolastico e integrazione con il motore solutore FET."
site_author = "Carlo Rigoni"

copyright = "Copyright &copy; 2026 Carlo Rigoni — Rilasciato sotto licenza GNU AGPLv3"

repo_url = "https://github.com/carlorigoni/eurario"
repo_name = "carlorigoni/eurario"

nav = [
  { "🇮🇹 Italiano" = [
    { "Panoramica" = "index.md" },
    { "Primo Accesso" = "getting-started.md" },
    { "Guida Utente & Casi d'Uso" = "user-guide.md" },
    { "Generazione Orario" = "timetable-flow.md" },
    { "Parametri & Cross-Reference FET" = "cross-reference.md" },
    { "Installazione Docker" = "docker-deploy.md" },
    { "README Ufficiale GitHub" = "readme-github.md" },
  ]},
  { "🇬🇧 English" = [
    { "General Overview" = "en/index.md" },
    { "Getting Started" = "en/getting-started.md" },
    { "User Guide & Use Cases" = "en/user-guide.md" },
    { "Timetable Flow" = "en/timetable-flow.md" },
    { "Parameters & FET Cross-Reference" = "en/cross-reference.md" },
    { "Docker Deployment" = "en/docker-deploy.md" },
    { "Official GitHub README" = "en/readme-github.md" },
  ]},
]

extra_css = ["stylesheets/extra.css?v=1.9.4.1"]
extra_javascript = ["javascripts/eurario-docs.js?v=1.9.4.1"]

[project.theme]
language = "it"
favicon = "assets/favicon-192.png"
logo = "assets/eurario-mark.svg"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Plus Jakarta Sans"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Passa al tema chiaro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Passa al tema scuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Passa alle preferenze di sistema"

[[project.extra.alternate]]
name = "Italiano"
link = "/"
lang = "it"

[[project.extra.alternate]]
name = "English"
link = "/en/"
lang = "en"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
